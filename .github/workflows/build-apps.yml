# Build the point-and-click application for macOS and Windows, and publish
# the results as a (pre-)release.
#
# Unlike the test-and-package-* workflows, this one does not need any git
# tags or repository secrets, so it also works in a fork.  It runs:
#
#  - when a commit is pushed to the branch "release-builds", or
#  - manually ("Run workflow" on the Actions tab; this button only appears
#    once this file is on the repository's default branch.)
#
# The applications are NOT code-signed or notarized.  See the release notes
# that this workflow writes for how to open them anyway.

name: Build Mac and Windows apps
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (PEP 440), eg 1.3.2.post20261116. Empty: base version + today''s date'
        required: false
        default: ''
  push:
    branches:
      - release-builds

permissions:
  contents: write

env:
  # the upstream release that this build is based on
  BASE_VERSION: "1.3.2"

jobs:

  prepare:
    name: Choose the version and create the release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Choose the version
      id: version
      env:
        REQUESTED: ${{ github.event.inputs.version }}
      run: |
        if [ -n "$REQUESTED" ]; then
          VERSION="$REQUESTED"
        else
          VERSION="${BASE_VERSION}.post$(date -u +%Y%m%d)"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Building version ${VERSION}"

    - name: Create (or update) the release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.version }}
        target_commitish: ${{ github.sha }}
        name: Cytoflow-GCB ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        body: |
          ## Cytoflow-GCB ${{ steps.version.outputs.version }}

          Packages for **macOS (Apple Silicon)** and **Windows**.
          See [`CHANGES.md`](https://github.com/${{ github.repository }}/blob/master/CHANGES.md) for the full list of changes.

          **These applications are not code-signed**, so macOS and Windows will warn before the first launch.

          ### macOS (Apple Silicon — M1/M2/M3/M4)
          1. Download `cytoflow-gcb-gui-*-macos_arm64.zip` and unzip it.
          2. Move **Cytoflow-GCB.app** to your Applications folder.
          3. First launch: right-click (or Control-click) the app → **Open** → **Open** again.
          4. If macOS still says "app is damaged", run once in Terminal:
             ```
             xattr -dr com.apple.quarantine /Applications/Cytoflow-GCB-*.app
             ```

          ### Windows
          1. Download `cytoflow-gcb-gui-*-win_x86-64.exe` and run it.
          2. If Windows SmartScreen appears, click **More info** → **Run anyway**.

  build-macos:
    name: Build macOS app (arm64)
    needs: prepare
    runs-on: macos-15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - name: Check out repo
      uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        submodules: true

    - name: Remove lines with [win]
      run: |
        sed -i '' '/\[win\]/d' package/environment-build.yml

    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v4.0.1
      with:
        auto-update-conda: true
        channels: defaults, cytoflow, conda-forge
        channel-priority: flexible
        activate-environment: cytoflow
        environment-file: package/environment-build.yml

    - name: Install package locally
      run: |
        pip install --verbose --editable .

    - name: Smoke-test the library
      continue-on-error: true
      env:
        MPLBACKEND: Agg
        OMP_NUM_THREADS: 1
      run: |
        python -c "import cytoflow, importlib.metadata as m; print(m.version(\"cytoflow\"))"
        nose2 -v -c package/nose2.cfg cytoflow.tests.test_polygon cytoflow.tests.test_autospill cytoflow.tests.test_gatingml

    - name: Build embedded help docs
      run: |
        sphinx-build docs/user_manual/reference cytoflowgui/help

    - name: Build GUI binary
      run: |
        pyinstaller package/pyinstaller.spec

    - name: Check the app bundle
      run: |
        ls dist/
        test -d dist/Cytoflow-GCB.app
        codesign --verify --deep --verbose=2 dist/Cytoflow-GCB.app || echo "::warning::codesign verification failed"

    - name: Zip the app
      id: zip_app
      run: |
        cd dist/
        mv Cytoflow-GCB.app "Cytoflow-GCB-${VERSION}.app"
        # ditto keeps the symlinks and permissions inside the bundle intact
        ditto -c -k --sequesterRsrc --keepParent "Cytoflow-GCB-${VERSION}.app" "cytoflow-gcb-gui-${VERSION}-macos_arm64.zip"
        rm -rf "Cytoflow-GCB-${VERSION}.app" cytoflow
        echo "GUI_FILE=cytoflow-gcb-gui-${VERSION}-macos_arm64.zip" >> $GITHUB_OUTPUT
        ls -l

    - name: Save the app as an artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: macos-arm64-app
        retention-days: 30
        path: dist/*

    - name: Upload the app to the release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.prepare.outputs.version }}
        prerelease: true
        working_directory: dist
        files: |
          ${{ steps.zip_app.outputs.GUI_FILE }}

  build-windows:
    name: Build Windows installer
    needs: prepare
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - name: Check out repo
      uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        submodules: true

    - name: Set up Visual Studio shell
      uses: egor-tensin/vs-shell@v2.1
      with:
        arch: x64

    - name: Remove link
      run: |
        rm -f /usr/bin/link.exe

    - name: Install NSIS
      uses: repolevedavaj/install-nsis@v1.2.1
      with:
        nsis-version: '3.12'

    - name: Remove lines with [not win]
      run: |
        sed -i '/\[not win\]/d' package/environment-build.yml

    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v4.0.1
      with:
        auto-update-conda: true
        channels: defaults, cytoflow, conda-forge
        channel-priority: flexible
        activate-environment: cytoflow
        environment-file: package/environment-build.yml

    - name: Install package locally
      run: |
        pip install --verbose --editable .

    - name: Smoke-test the library
      continue-on-error: true
      env:
        MPLBACKEND: Agg
        OMP_NUM_THREADS: 1
      run: |
        python -c "import cytoflow, importlib.metadata as m; print(m.version(\"cytoflow\"))"
        nose2 -v -c package/nose2.cfg cytoflow.tests.test_polygon cytoflow.tests.test_autospill cytoflow.tests.test_gatingml

    - name: Build embedded help docs
      run: |
        sphinx-build docs/user_manual/reference cytoflowgui/help

    - name: Build GUI binary
      run: |
        pyinstaller package/pyinstaller.spec

    - name: Build installer
      run: |
        makensis.exe //NOCD package/installer.nsis

    - name: Rename the installer
      id: zip_app
      run: |
        cd dist
        mv cytoflow-installer.exe "cytoflow-gcb-gui-${VERSION}-win_x86-64.exe"
        echo "GUI_FILE=cytoflow-gcb-gui-${VERSION}-win_x86-64.exe" >> $GITHUB_OUTPUT
        rm -rf cytoflow
        ls -l

    - name: Save the installer as an artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: windows-installer
        retention-days: 30
        path: dist/*

    - name: Upload the installer to the release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.prepare.outputs.version }}
        prerelease: true
        working_directory: dist
        files: |
          ${{ steps.zip_app.outputs.GUI_FILE }}
