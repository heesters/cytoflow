<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Compensation: a spillover matrix (diagonal = 1, off-diagonal = spillover) -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" version="1.1" id="svg2">
  <g id="layer1" style="stroke:#000000;stroke-width:12">
    <rect x="40" y="40" width="140" height="140" style="fill:#0000ff" />
    <rect x="180" y="40" width="140" height="140" style="fill:#ff9999" />
    <rect x="320" y="40" width="140" height="140" style="fill:#ffffff" />
    <rect x="40" y="180" width="140" height="140" style="fill:#ffdddd" />
    <rect x="180" y="180" width="140" height="140" style="fill:#0000ff" />
    <rect x="320" y="180" width="140" height="140" style="fill:#ff4d4d" />
    <rect x="40" y="320" width="140" height="140" style="fill:#ffffff" />
    <rect x="180" y="320" width="140" height="140" style="fill:#ffbbbb" />
    <rect x="320" y="320" width="140" height="140" style="fill:#0000ff" />
  </g>
</svg>
